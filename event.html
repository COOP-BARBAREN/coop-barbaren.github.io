/* =========================================================
   NEW CODE - EVENT STYLING
   Everything below this comment has been added for the
   event listings. The original CSS above remains unchanged.
   ========================================================= */


/* Container for all events */
.events {
  margin: 0 20px 100px 20px;
}


/* Individual event.
   Each event takes up roughly 35-40% of the screen height,
   allowing around 2.5 events to be visible at once. */
.event {
  min-height: 36vh;
  margin-bottom: 80px;
  display: grid;
  grid-template-columns: 30% 58%;
  gap: 50px;
  align-items: center;
  max-width: 1100px;
  margin-left: auto;
  margin-right: auto;
  
  border-bottom: 1px solid rgba(0, 0, 0, 0.342);
  padding-bottom: 40px;
}

.event:last-child {
  border-bottom: none;
}


/* Event image */
.event-image {
  width: 36vh;
  height: 36vh;
  object-fit: cover;
  display: block;
  margin-left: auto;
}


/* Text section of each event */
.event-info {
  padding: 10px 20px 10px 0;
  text-align: left;
}


/* Event date and time */
.event-date {
  font-size: 11px;
  letter-spacing: 2px;
  font-weight: 600;
  margin-bottom: 15px;
}


/* Event title */
.event-title {
  font-size: 25px;
  letter-spacing: 3px;
  font-weight: 400;
  margin-bottom: 10px;
}


/* Artist name(s) */
.event-type {
  font-size: 13px;
  letter-spacing: 2px;
  font-weight: 600;
  margin-bottom: 20px;
}


/* Event description */
.event-description {
  font-size: 13px;
  line-height: 1.8;
  letter-spacing: 1px;
  font-weight: 300;
  margin-bottom: 20px;
  max-width: 500px;
}


/* Artist contact information */
.event-contact {
  font-size: 11px;
  letter-spacing: 1.5px;
  line-height: 1.8;
}


/* Makes sure the links inside event contact information
   behave like the rest of the website */
.event-contact a {
  text-decoration: underline;
}


/* Mobile layout:
   On smaller screens the image appears above the text.
   The events still remain compact enough for scrolling. */
@media (max-width: 700px) {

  .event {
    min-height: auto;
    display: block;
    margin-bottom: 70px;
  }

.event-image {
    width: min(38vh, 90vw);
    height: min(38vh, 90vw);
    margin: 10px auto 25px auto;
}

  .event-info {
    padding: 0;
    text-align: center;
  }

  .event-title {
    font-size: 22px;
  }

  .event-description {
    font-size: 13px;
    max-width: 500px;
    margin: 0 auto 20px auto;
  }
}


/* =========================================================
   END OF NEW EVENT STYLING
   ========================================================= */

</style>
